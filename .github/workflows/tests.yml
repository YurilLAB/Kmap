name: kmap unit tests + hardening

# Unit tests, real loopback runtime assertions, binary hardening and a local
# TLS fingerprint check. All failures propagate and diagnostic files survive.

on:
  push:
    paths:
      - ".github/workflows/tests.yml"
      - "**/*.cc"
      - "**/*.h"
      - "**/*.c"
      - "Makefile.in"
      - "configure"
      - "configure.ac"
      - "m4/**"
      - "tests/**"
      - "scripts/update_epss_kev.py"
      - "scripts/update_cves.py"
      - "scripts/add_cves.py"
      - "ncat/test/test-addrset.sh"
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: build + make check-kmap + hardening
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang autoconf libpcap-dev libnet-dev libpcre2-dev

      - name: Configure hardening feature probes and flag overrides
        run: python3 tests/configure_hardening_test.py

      - name: Subtool stack-protector runtime propagation
        run: python3 tests/subtool_ssp_test.py

      - name: Distributed configure scripts without Autoconf
        run: python3 tests/distributed_configure_test.py

      - name: Configure + build
        run: |
          set -euo pipefail
          mkdir -p test-results
          ./configure 2>&1 | tee test-results/configure.log
          make -j2 2>&1 | tee test-results/build.log
          test -x ./kmap || { echo "::error::kmap binary was not built"; exit 1; }

      - name: Unit suite (make check-kmap)
        run: |
          set -euo pipefail
          python3 tests/check_test_gate.py
          # Runs every tests/*_test binary; each prints a pass/fail line and
          # exits non-zero on the first failed assertion.
          timeout 180 make check-kmap 2>&1 | tee test-results/unit.log

      - name: Offline vulnerability feed refresh contracts
        run: python3 tests/update_epss_kev_test.py

      - name: Offline CVE import contracts
        run: python3 tests/update_cves_test.py

      - name: Inherited Ncat, Nsock and NSE unit suites
        run: timeout 180 make check-ncat check-nsock check-nse

      - name: Runtime smoke (owned loopback listener, repeated runs and bad input)
        run: python3 tests/runtime_smoke.py ./kmap --artifacts test-results/runtime

      - name: HTTP metadata boundaries (owned loopback with header-like response bodies)
        run: python3 tests/http_metadata_smoke.py ./kmap --artifacts test-results/http-metadata

      - name: Sync and async enrichment HTTP boundaries (owned loopback)
        run: python3 tests/enrichment_http_contracts.py ./kmap --artifacts test-results/enrichment-http

      - name: Stored JSON findings and patch comparison contracts (offline)
        run: python3 tests/report_json_contracts.py ./kmap --artifacts test-results/report-json

      - name: Web recon HTTPS, titles, paths and tarpits (owned loopback)
        run: python3 tests/web_recon_contracts.py ./kmap --artifacts test-results/web-recon

      - name: CVE map matches against the shipped DB (owned loopback banners)
        run: |
          python3 tests/cve_map_fixture_test.py
          python3 tests/cve_map_contracts.py ./kmap --artifacts test-results/cve-map

      - name: Upgraded services drop stored CVEs (owned loopback net-scan)
        run: python3 tests/cve_upgrade_contracts.py ./kmap --artifacts test-results/cve-upgrade

      - name: Offline query smoke (isolated legacy SQLite fixtures)
        run: python3 tests/query_smoke.py ./kmap --artifacts test-results/query

      - name: Offline query filter contracts (stored metadata and argument validation)
        run: python3 tests/query_filters.py ./kmap --artifacts test-results/query-filters

      - name: Shard path and error propagation contracts (offline SQLite fixtures)
        run: python3 tests/shard_path_contracts.py ./kmap --artifacts test-results/shard-paths

      - name: Export paths preserve stored data (offline fixtures)
        run: python3 tests/export_paths.py ./kmap --artifacts test-results/export-paths

      - name: Yuril export write failures keep the last export
        run: python3 tests/yuril_export_contracts.py ./kmap --artifacts test-results/yuril-export

      - name: Stored graph depth, cohort and failure contracts (offline fixtures)
        run: python3 tests/graph_contracts.py ./kmap --artifacts test-results/graph-contracts

      - name: Topology export failure contracts (offline fixtures)
        run: python3 tests/topo_export_contracts.py ./kmap --artifacts test-results/topo-export

      - name: Ordinary output contracts (owned loopback and write failures)
        run: python3 tests/output_contracts.py ./kmap --artifacts test-results/output-contracts

      - name: Offline phase error and findings contracts
        run: python3 tests/net_pipeline_errors.py ./kmap --artifacts test-results/pipeline-errors

      - name: Watchlist collection and persistence contracts (owned loopback)
        run: |
          python3 tests/watchlist_contracts.py ./kmap --artifacts test-results/watchlist
          python3 tests/watchlist_contracts.py ./kmap --rapid --artifacts test-results/watchlist-rapid

      - name: Net-scan and watchlist option contracts (owned loopback)
        run: python3 tests/net_option_contracts.py ./kmap --artifacts test-results/net-options

      - name: Ordinary resume contracts (owned loopback and preserved invalid logs)
        run: python3 tests/resume_contracts.py ./kmap --artifacts test-results/resume

      - name: Resume partial host and watchlist retry boundaries (owned loopback)
        run: |
          python3 tests/resume_boundaries.py ./kmap --artifacts test-results/resume-boundaries
          python3 tests/watchlist_cve_retry.py ./kmap --artifacts test-results/watchlist-cve-retry

      - name: Resume and structured output contracts (preserve saved results)
        run: python3 tests/resume_output_contracts.py ./kmap --artifacts test-results/resume-output

      - name: Binary hardening (exploit-mitigation regressions fail CI)
        run: |
          set -euo pipefail
          # Save complete output first: grep -q pipelines can SIGPIPE readelf
          # under pipefail and misreport a present mitigation as missing.
          readelf -lW kmap > test-results/elf-segments.txt
          readelf -dW kmap > test-results/elf-dynamic.txt
          readelf -hW kmap > test-results/elf-header.txt
          readelf -sW kmap > test-results/elf-symbols.txt
          fail=0
          # NX: the stack must not be executable (GNU_STACK without 'E').
          grep -q GNU_STACK test-results/elf-segments.txt || { echo "::error::missing GNU_STACK"; fail=1; }
          if grep -q 'GNU_STACK.*RWE' test-results/elf-segments.txt; then
            echo "::error::executable stack (NX disabled)"; fail=1; fi
          # Full RELRO: GNU_RELRO segment + BIND_NOW.
          grep -q GNU_RELRO test-results/elf-segments.txt || { echo "::error::no RELRO"; fail=1; }
          grep -q BIND_NOW test-results/elf-dynamic.txt || { echo "::error::no BIND_NOW (partial RELRO)"; fail=1; }
          # PIE: position-independent executable (ASLR for the image).
          grep -qE 'Type:[[:space:]]+DYN' test-results/elf-header.txt || { echo "::error::not PIE"; fail=1; }
          # Stack-smashing protector.
          grep -q __stack_chk_fail test-results/elf-symbols.txt || { echo "::error::no stack canary"; fail=1; }
          # _FORTIFY_SOURCE fortified libc wrappers present.
          grep -qE '__(memcpy|sprintf|snprintf|strcpy|printf)_chk' test-results/elf-symbols.txt \
            || { echo "::error::no _FORTIFY_SOURCE (_chk wrappers absent)"; fail=1; }
          [ "$fail" -eq 0 ] && echo "hardening OK: NX, full RELRO, PIE, canary, FORTIFY"
          exit "$fail"

      - name: Preserve unit and runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-runtime-results
          path: |
            test-results/
            config.log
          retention-days: 14

  jarm-e2e:
    name: JARM is well-formed and repeatable against a local TLS server
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Build a JARM driver
        run: |
          cat > /tmp/jarm_main.cc <<'CC'
          #include <cstdio>
          #include <cstdlib>
          #include "jarm.h"
          int main(int argc, char **argv) {
            if (argc < 3) return 2;
            std::string j = jarm_fingerprint(argv[1], atoi(argv[2]), 3000);
            printf("%s\n", j.empty() ? "<none>" : j.c_str());
            return 0;
          }
          CC
          g++ -O2 -std=gnu++17 -I. /tmp/jarm_main.cc jarm.cc -o /tmp/kjarm

      - name: Check local TLS fingerprint shape, nonzero value and repeatability
        run: python3 tests/jarm_smoke.py /tmp/kjarm --artifacts test-results/jarm

      - name: Preserve TLS test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jarm-results
          path: test-results/jarm/
          retention-days: 14
