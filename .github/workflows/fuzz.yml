name: kmap fuzz + sanitizers

# Builds the executable harness manifest under AddressSanitizer and
# UndefinedBehaviorSanitizer, including bundled SQLite and offline storage,
# graph-output and topology-assembly regressions. Each command runs with an
# isolated working directory and preserves its status, logs and fixtures.
#
# Coverage differs by harness: some link production sources/headers; others
# retain copied parsers or logic models. For example, test_netdb links the real
# net_db.cc, whereas test_netquery exercises a copied filter implementation
# against SQLite and does not establish coverage of the shipping query CLI.
# The manifest records these distinctions; a passing copied harness is not
# proof that production code behaves identically.
#
# The production JSON serializer also has a bounded libFuzzer job below.
# Additional fuzz/ossfuzz targets run in the separate ClusterFuzzLite workflows.

on:
  push:
    paths:
      - ".github/workflows/fuzz.yml"
      - "fuzz/**"
      - "tests/**"
      - "**/*.c"
      - "Makefile.in"
      - "**/*.cc"
      - "**/*.h"
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sanitize-fuzz:
    name: ASan/UBSan parser harnesses
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - uses: actions/checkout@v5

      - name: Validate executable harness inventory
        run: python3 tests/run_sanitizer_harnesses.py --validate-only

      - name: Build and run isolated harnesses (ASan + UBSan)
        run: python3 tests/run_sanitizer_harnesses.py --output test-results/fuzz --total-timeout 1500

      - name: Preserve sanitizer diagnostics and test-owned fixtures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sanitizer-harness-results
          path: |
            test-results/fuzz/
            !test-results/fuzz/bin/
          include-hidden-files: true
          retention-days: 14

  enrichment-libfuzzer:
    name: Offline enrichment storage libFuzzer + ASan + UBSan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - uses: actions/checkout@v5
      - name: Build storage handoff and instrument bundled SQLite
        run: |
          set -euo pipefail
          mkdir -p test-results/storage
          clang++ --version | tee test-results/storage/compiler.txt
          clang -O1 -g -fsanitize=fuzzer-no-link,address,undefined \
            -fno-sanitize-recover=all -fno-omit-frame-pointer \
            -DSQLITE_THREADSAFE=0 -DSQLITE_ENABLE_FTS5 \
            -c sqlite/sqlite3.c -o test-results/storage/sqlite3.o \
            2>&1 | tee test-results/storage/sqlite-build.log
          clang++ -O1 -g -std=c++17 -pthread -I. -Inbase \
            -fsanitize=fuzzer,address,undefined -fno-sanitize-recover=all \
            -fno-omit-frame-pointer fuzz/ossfuzz/fuzz_enrichment_store.cc \
            net_db.cc net_fp_helpers.cc test-results/storage/sqlite3.o -ldl \
            -o test-results/storage/fuzzer \
            2>&1 | tee test-results/storage/fuzzer-build.log
      - name: Bounded offline transaction fuzzing with fixed seeds
        run: |
          python3 tests/run_offline_fuzz.py --binary test-results/storage/fuzzer --corpus fuzz/corpus/enrichment-store --output test-results/storage/seed-1 --seconds 30 --seed 1
          python3 tests/run_offline_fuzz.py --binary test-results/storage/fuzzer --corpus fuzz/corpus/enrichment-store --output test-results/storage/seed-1337 --seconds 30 --seed 1337
      - name: Preserve storage corpus, failures and statistics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enrichment-libfuzzer-results
          path: |
            test-results/storage/seed-*/
            test-results/storage/*.txt
            test-results/storage/*.log
          retention-days: 14

  json-libfuzzer:
    name: Real JSON serializer libFuzzer + ASan + UBSan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - uses: actions/checkout@v5
      - name: Build the production serializer fuzz target
        run: |
          set -euo pipefail
          mkdir -p test-results
          clang++ --version | tee test-results/fuzzer-compiler.txt
          clang++ -O1 -g -std=c++17 -fsanitize=fuzzer,address,undefined \
            -fno-sanitize-recover=all -fno-omit-frame-pointer \
            fuzz/ossfuzz/fuzz_jsonescape.cc -o test-results/fuzz_jsonescape \
            2>&1 | tee test-results/fuzzer-build.log
      - name: Bounded offline fuzzing with fixed seeds
        run: |
          python3 tests/run_offline_fuzz.py --binary test-results/fuzz_jsonescape --output test-results/seed-1 --seconds 30 --seed 1
          python3 tests/run_offline_fuzz.py --binary test-results/fuzz_jsonescape --output test-results/seed-1337 --seconds 30 --seed 1337
      - name: Preserve corpus, crashes, commands and statistics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: json-libfuzzer-results
          path: |
            test-results/seed-*/
            test-results/fuzzer-*.txt
            test-results/fuzzer-*.log
          retention-days: 14
