name: kmap fuzz + sanitizers

# Runs the YurilLAB parser/logic harnesses under AddressSanitizer +
# UndefinedBehaviorSanitizer on every push/PR. These are the same harnesses
# kept in fuzz/ that are run locally on Windows with guard pages + UBSan-trap;
# on Linux we get ASan's allocator red-zones and full UBSan diagnostics, which
# catch the same out-of-bounds / overflow / UB classes with richer reports.
#
# Scope: this job builds and runs, under ASan+UBSan, every standalone harness
# in fuzz/ -- the self-contained parser fuzzers/oracles, the guard-page fuzzers
# (fuzz_core/dns/proto, ported from their original VirtualAlloc form to
# mmap/mprotect so they run here too), and the sqlite-backed LIVE tests
# (test_netdb links the real net_db.cc; test_netquery exercises net_query's
# verbatim filter logic) -- the latter two linked against a freshly built
# sqlite amalgamation. The libFuzzer/OSS-Fuzz targets under fuzz/ossfuzz/ run
# separately via cflite_pr.yml (PRs) and cflite_batch.yml (scheduled).

on:
  push:
    paths:
      - ".github/workflows/fuzz.yml"
      - "fuzz/**"
      - "**/*.cc"
      - "**/*.h"
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sanitize-fuzz:
    name: ASan/UBSan parser harnesses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Compiler version
        run: g++ --version

      - name: Build + run harnesses (ASan + UBSan, abort on any finding)
        run: |
          set -euo pipefail
          mkdir -p /tmp/fz
          # -fno-sanitize-recover=all => any ASan/UBSan finding aborts (CI fails).
          CXXFLAGS="-O1 -g -std=gnu++17 -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer"
          # Each harness either runs an oracle (nonzero exit on mismatch) or
          # drives a parser over millions of inputs (ASan aborts on a fault).
          # -pthread is harmless for the non-threaded harnesses and required
          # by test_lowwater (real worker-pool crash-snapshot stress).
          for h in test_cidr_parse test_json_escape test_discover_bail test_admit_reentry test_lowwater test_sha256 test_watchlist_diff test_ratelimit test_header_extract test_checkpoint test_excludes fuzz_text fuzz_query; do
            echo "::group::$h"
            g++ $CXXFLAGS -pthread "fuzz/$h.cc" -o "/tmp/fz/$h"
            # two seeds widen input coverage between runs
            "/tmp/fz/$h" 1
            "/tmp/fz/$h" 1337
            echo "::endgroup::"
          done

          # Guard-page fuzzers (mmap/mprotect PROT_NONE): exact-boundary
          # over-read detection for untrusted-input parsers --
          #   fuzz_dns   : asn_lookup.cc DNS wire parser (network data)
          #   fuzz_proto : default_creds/net_enrich binary protocol parsers
          #   fuzz_core  : fast_syn cidr/permute + cpu governor control law
          # They map a guard page per iteration so they are slower than the
          # no-alloc harnesses above; run a smaller per-push budget here (the
          # 2nd arg caps iterations / the permute window). Deep runs use the
          # 20M / full default locally. These were Windows-only until ported
          # to mmap, which is why they were absent from CI before.
          for h in fuzz_dns fuzz_proto fuzz_core; do
            echo "::group::$h"
            g++ $CXXFLAGS "fuzz/$h.cc" -o "/tmp/fz/$h"
            "/tmp/fz/$h" 1 300000
            "/tmp/fz/$h" 1337 300000
            echo "::endgroup::"
          done

          # SQLite-backed LIVE tests: these link the REAL net_db.cc (and
          # net_query's verbatim filter logic) against a real database, so they
          # catch storage / predicate regressions the parser fuzzers cannot --
          # e.g. the drain-loop invariant that net_db_count_unenriched() and
          # net_db_get_unenriched() stay in lockstep. Build the sqlite
          # amalgamation once (plain -O1; it is upstream and well-tested) and
          # link it into each test compiled with the sanitizers.
          echo "::group::sqlite-backed live tests"
          cc -O1 -c sqlite/sqlite3.c -o /tmp/fz/sqlite3.o
          g++ $CXXFLAGS -I. fuzz/test_netdb.cc net_db.cc /tmp/fz/sqlite3.o \
            -lpthread -ldl -o /tmp/fz/test_netdb && /tmp/fz/test_netdb
          g++ $CXXFLAGS -I. fuzz/test_netquery.cc /tmp/fz/sqlite3.o \
            -lpthread -ldl -o /tmp/fz/test_netquery && /tmp/fz/test_netquery
          g++ $CXXFLAGS -I. fuzz/test_cve_limit.cc /tmp/fz/sqlite3.o \
            -lpthread -ldl -o /tmp/fz/test_cve_limit && /tmp/fz/test_cve_limit
          echo "::endgroup::"

          # LIVE test linking the real os_profile.cc -- pins the HTTP probe
          # request builder (used by every enrichment + recon path) as
          # well-formed (Host header, single CRLFCRLF terminator, IPv6
          # bracketing). setsockopt resolves in libc on Linux.
          echo "::group::test_osprofile"
          g++ $CXXFLAGS -I. fuzz/test_osprofile.cc os_profile.cc \
            -o /tmp/fz/test_osprofile && /tmp/fz/test_osprofile
          echo "::endgroup::"

      - name: Summary
        if: always()
        run: echo "Parser harnesses completed under ASan+UBSan."
