name: kmap multiplatform autobuilds

on:
  push:
    paths:
      - ".github/workflows/build.yml"
      # Windows-build inputs: without these a vcxproj/sln/Build.bat change
      # (toolset, source parity, deps) silently skips CI and only surfaces a
      # break on the next source push. (See the libnetutil/liblinear LTCG and
      # the sys_resources/cpu_meter parity breaks -- both vcxproj-only.)
      - "**/*.vcxproj"
      - "**/*.sln"
      - "**/*.bat"
      - "**/*.c"
      - "**/*.cc"
      - "**/*.cpp"
      - "**/*.h"
      - "**/*.H"
      - "**/*.in"
      - "**/*.am"
      - "**/*.ac"
      - "m4/**"
      - "**/*.lua"
      - "**/*.cmakein"
      - "**/configure"
      - "**/*.pl"
      - "**/*.py"
      - "**/*.awk"
      - "**/*.sh"
      - "**/*.toml"
      - "libpcre/src/*.sym"
    branches:
      - master
  pull_request:
  workflow_dispatch:
    inputs:
      deploymentName:
        description: "Name for this deployment"
        required: true
        default: "Manual Deployment"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MAKEFLAGS: -j3

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-latest-gcc
            os: ubuntu-latest
            cc: gcc
            cxx: g++
          - name: ubuntu-24.04-arm-gcc
            os: ubuntu-24.04-arm
            cc: gcc
            cxx: g++
          - name: ubuntu-latest-clang
            os: ubuntu-latest
            cc: clang
            cxx: clang++
          - name: macos-15-clang
            os: macos-15
            cc: clang
            cxx: clang++
          - name: macos-26-clang
            os: macos-26
            cc: clang
            cxx: clang++
          - name: freebsd-15-gcc
            os: ubuntu-latest
            cc: gcc
            cxx: g++
          - name: freebsd-15-clang
            os: ubuntu-latest
            cc: clang
            cxx: clang++
          - name: openbsd-7-gcc
            os: ubuntu-latest
            cc: egcc
            cxx: eg++
          - name: openbsd-7-clang
            os: ubuntu-latest
            cc: clang
            cxx: clang++
          - name: netbsd-10-gcc
            os: ubuntu-latest
            cc: gcc
            cxx: g++
          - name: netbsd-10-clang
            os: ubuntu-latest
            cc: clang
            cxx: clang++
          - name: solaris-11-gcc
            os: ubuntu-latest
            cc: gcc
            cxx: g++
          - name: solaris-11-clang
            os: ubuntu-latest
            cc: clang
            cxx: clang++
          - name: windows-2022-msvc
            # Retain the established VS 2022 runner while Build.bat's newer
            # Visual Studio detection receives hosted CI validation.
            os: windows-2022
            cc: msvc
            cxx: msvc

    runs-on: ${{ matrix.os }}
    # Bound every matrix job. The slowest legitimate job (the OpenBSD VM) runs
    # ~14 min; 30 gives margin while a genuinely hung runner/VM fails fast and
    # visibly instead of hanging on the 6-hour default and blocking completion.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Check bundled exports and VM failure reporting
        if: matrix.name == 'ubuntu-latest-clang'
        run: python3 tests/check_build_config.py

      - name: Build Linux
        if: startsWith(matrix.name,'ubuntu')
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          set -euo pipefail
          mkdir -p test-results
          sudo apt-get update
          sudo apt-get install -y build-essential clang tree libpcap-dev libnet-dev libpcre2-dev
          "$CC" --version
          "$CXX" --version
          ./configure 2>&1 | tee test-results/configure.log
          make 2>&1 | tee test-results/build.log
          # Fail loudly if the binary was not actually produced. A bare `make`
          # previously exited 0 while building only sqlite3.o (wrong default
          # goal), so build breaks passed CI undetected.
          test -x ./kmap || { echo "::error::kmap binary was not built"; exit 1; }
          make install DESTDIR=/tmp
          tree /tmp/usr

      - name: Smoke test Linux
        if: startsWith(matrix.name,'ubuntu')
        run: python3 tests/runtime_smoke.py ./kmap --artifacts test-results/runtime

      - name: Build MacOS
        if: startsWith(matrix.name,'macos')
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          brew update
          # PCRE2 is already installed
          brew install tree libpcap libnet
          ./configure
          make
          make install DESTDIR=/tmp
          tree /tmp/usr

      - name: Start FreeBSD VM
        if: startsWith(matrix.name,'freebsd')
        uses: vmactions/freebsd-vm@v1
        with:
          release: "15.0"
          sync: rsync
          custom-shell-name: kmap-vm

      - name: Start OpenBSD VM
        if: startsWith(matrix.name,'openbsd')
        uses: vmactions/openbsd-vm@v1
        with:
          # Keep the advertised 7.x target; an omitted release selected 8.0.
          release: "7.9"
          sync: rsync
          custom-shell-name: kmap-vm

      - name: Start NetBSD VM
        if: startsWith(matrix.name,'netbsd')
        uses: vmactions/netbsd-vm@v1
        with:
          release: "10.2"
          sync: rsync
          custom-shell-name: kmap-vm

      - name: Start Solaris VM
        if: startsWith(matrix.name,'solaris')
        uses: vmactions/solaris-vm@v1
        with:
          release: "11.4"
          sync: rsync
          custom-shell-name: kmap-vm

      # The action's prepare/run inputs exit before copyback on a failure.
      # Its rsync custom-shell wrapper copies files back even when the command
      # fails, then returns that failure. Keep setup/build outside those inputs
      # so config.log and the complete failing command log reach the artifact.
      - name: Build Unix VM
        if: startsWith(matrix.name,'freebsd') || startsWith(matrix.name,'openbsd') || startsWith(matrix.name,'netbsd') || startsWith(matrix.name,'solaris')
        shell: kmap-vm {0}
        run: |
          set -eu
          mkdir -p test-results
          record() {
            log=$1
            shift
            if "$@" >"test-results/$log.log" 2>&1; then
              cat "test-results/$log.log"
            else
              rc=$?
              cat "test-results/$log.log"
              return "$rc"
            fi
          }
          case '${{ matrix.name }}' in
            freebsd-*)
              # The base OS already supplies libpcap.
              record prepare pkg install -y gcc llvm autotools tree pkgconf libnet pcre2 gmake dbus
              ;;
            openbsd-*)
              export PKG_PATH=https://cdn.openbsd.org/pub/OpenBSD/$(uname -r)/packages/$(uname -m)/
              # 7.9 ships GCC 15 and pkg-config in base. C++ is a separate
              # package; requesting removed gcc%11/pkgconf names fails setup.
              record prepare pkg_add -I -U autoconf%2.72 automake%1.17 gcc g++ llvm%19 tree libnet%1.1 pcre2 gmake dbus
              export AUTOCONF_VERSION=2.72 AUTOMAKE_VERSION=1.17
              ;;
            netbsd-*)
              export PATH=/usr/sbin:/usr/pkg/sbin:/usr/pkg/bin:$PATH
              # Retain the VM's verified package-mirror configuration.
              # D-Bus is not a Kmap build dependency: bundled libpcap already
              # uses --disable-dbus. Installing it required absent X11 sets.
              record prepare pkg_add -u gcc13 clang autoconf automake pkgconf libpcap libnet gmake tree
              export PATH=/usr/pkg/gcc13/bin:$PATH
              ;;
            solaris-*)
              record prepare pkg install gcc-c clang autoconf automake pcre2 libpcap libnet developer/build/gnu-make
              ;;
            *) exit 1 ;;
          esac
          export CC=${{ matrix.cc }} CXX=${{ matrix.cxx }}
          record cc-version "$CC" --version
          record cxx-version "$CXX" --version
          record configure ./configure
          record build gmake
          test -x ./kmap
          record install gmake install DESTDIR=/tmp
          # Solaris does not install the optional tree utility above.
          record installed-files find /tmp/usr -type f

      - name: Windows build-script regression fixtures (offline)
        if: startsWith(matrix.name,'windows')
        shell: cmd
        run: |
          set "KMAP_TEST_VS="
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "KMAP_TEST_VS=%%i"
          if not defined KMAP_TEST_VS exit /b 1
          call "%KMAP_TEST_VS%\Common7\Tools\vsdevcmd.bat" -arch=x64 -host_arch=x64
          if errorlevel 1 exit /b %errorlevel%
          python tests/windows_build_test.py --cc cl --output test-results/windows-build

      - name: Install Subversion
        if: startsWith(matrix.name,'windows')
        shell: powershell
        run: |
          choco install svn -y --no-progress
          $env:PATH = "C:\Program Files (x86)\Subversion\bin;C:\Program Files\Subversion\bin;$env:PATH"
          echo "C:\Program Files (x86)\Subversion\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "C:\Program Files\Subversion\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build Windows
        if: startsWith(matrix.name,'windows')
        shell: cmd
        run: |
          cd mswin32
          Build.bat

      - name: Windows resume contracts (owned loopback)
        if: startsWith(matrix.name,'windows')
        run: python tests/resume_contracts.py mswin32/Release/kmap.exe --artifacts test-results/resume

      - name: Windows export paths preserve stored data (offline fixtures)
        if: startsWith(matrix.name,'windows')
        run: python tests/export_paths.py mswin32/Release/kmap.exe --artifacts test-results/export-paths

      - name: Windows stored graph contracts (offline fixtures)
        if: startsWith(matrix.name,'windows')
        run: python tests/graph_contracts.py mswin32/Release/kmap.exe --artifacts test-results/graph-contracts

      - name: Windows resume and structured output contracts
        if: startsWith(matrix.name,'windows')
        run: python tests/resume_output_contracts.py mswin32/Release/kmap.exe --artifacts test-results/resume-output

      - name: Windows partial host resume boundaries (owned loopback)
        if: startsWith(matrix.name,'windows')
        run: python tests/resume_boundaries.py mswin32/Release/kmap.exe --artifacts test-results/resume-boundaries

      - name: Windows watchlist CVE retry boundaries (owned loopback)
        if: startsWith(matrix.name,'windows')
        run: python tests/watchlist_cve_retry.py mswin32/Release/kmap.exe --artifacts test-results/watchlist-cve-retry

      - name: Preserve build and runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.name }}
          path: |
            test-results/
            config.log
            mswin32/*.log
          retention-days: 14
