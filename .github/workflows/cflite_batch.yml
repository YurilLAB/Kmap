name: ClusterFuzzLite batch fuzzing

# Batch fuzzing of the libFuzzer targets built via .clusterfuzzlite/. Runs on
# relevant main changes, daily, and on demand. The PR workflow separately
# exercises proposed changes in code-change mode.
#
# The same fuzz/ossfuzz/*.cc + .clusterfuzzlite/build.sh are reused, so there
# is nothing extra to maintain. To accumulate a persistent corpus across runs
# later, add a `storage-repo` to the run step. The build packages the committed
# JSON seeds; other targets start without a seed corpus.

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/cflite_batch.yml"
      - ".clusterfuzzlite/**"
      - "fuzz/corpus/**"
      - "**/*.cc"
      - "**/*.h"
  schedule:
    # Daily at 06:17 UTC (off-peak; minute offset to avoid the top-of-hour
    # scheduler stampede). Scheduled workflows run from the default branch.
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      fuzz_seconds:
        description: "Total fuzzing budget per sanitizer (seconds)"
        required: false
        default: "600"

permissions:
  contents: read

jobs:
  Batch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, undefined]
    steps:
      - name: Build fuzzers (${{ matrix.sanitizer }})
        id: build
        uses: google/clusterfuzzlite/actions/build_fuzzers@v1
        with:
          language: c++
          sanitizer: ${{ matrix.sanitizer }}
      - name: Run fuzzers (${{ matrix.sanitizer }})
        id: run
        uses: google/clusterfuzzlite/actions/run_fuzzers@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: ${{ github.event.inputs.fuzz_seconds || 600 }}
          mode: "batch"
          sanitizer: ${{ matrix.sanitizer }}
          output-sarif: true
